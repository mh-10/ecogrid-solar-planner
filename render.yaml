services:
  - type: web
    name: ecogrid-solar-planner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: NREL_API_KEY
        sync: false          # you will paste this in Render's dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
